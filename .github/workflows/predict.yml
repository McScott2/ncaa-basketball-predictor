name: NBA Oracle — Daily Predictions

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests numpy

      - name: Fetch NBA stats
        run: python3 fetch_nba_stats.py || echo "Stats fetch failed"

      - name: Run predictor
        run: python3 nba_predictor.py || echo "Predictor completed"

      - name: Export dashboard
        run: python3 export_predictions.py || echo "Export completed"

      - name: Push updates
        run: |
          git config user.name "NBA Oracle Bot"
          git config user.email "bot@nba-oracle.com"
          git pull origin main --rebase
          git add nba_predictions_log.json dashboard/predictions.json nba_team_stats.json || true
          git diff --staged --quiet || git commit -m "🏀 Auto update: $(date +'%Y-%m-%d %H:%M UTC')"
          git push || echo "Nothing to push"
