name: NBA Oracle — Daily Predictions
on:
  schedule:
    - cron: '0 6 * * *'   # 7AM WAT — morning run (compare results + tune)
    - cron: '0 16 * * *'  # 5PM WAT — evening run (fetch stats + predict)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Configure git
        run: |
          git config user.name "NBA Oracle Bot"
          git config user.email "bot@nba-oracle.com"

      - name: Pull latest (rebase over any remote changes)
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch NBA stats
        run: python3 fetch_nba_stats.py

      - name: Run predictor
        run: python3 nba_predictor.py || true

      - name: Tune model (self-learning)
        run: python3 tune_model.py || true

      - name: Export dashboard
        run: python3 export_predictions.py || true

      - name: Push updates (merge-safe)
        run: |
          # Pull latest remote changes before staging anything
          # This prevents conflicts caused by the bot running twice
          git fetch origin main

          # Use 'ours' strategy for the log file — always keep the version
          # that was locked first (morning run wins, evening run never overwrites)
          git config merge.ours.driver true
          echo "nba_predictions_log.json merge=ours" >> .gitattributes

          git merge -X ours origin/main --no-edit || true

          # Stage only the files we care about
          git add \
            nba_predictions_log.json \
            dashboard/predictions.json \
            nba_team_stats.json \
            model_weights.json \
            tune_log.json \
            .gitattributes \
            || true

          git diff --staged --quiet || git commit -m "🏀 Auto update: $(date +'%Y-%m-%d %H:%M UTC')"
          git push || echo "Nothing to push"